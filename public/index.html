<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DofLib — Gestionnaire Dofus</title>
<style>
  :root {
    --bg: #0f0f1a;
    --bg2: #17172b;
    --card: #1e1e38;
    --border: #2a2a4a;
    --text: #e8e8f0;
    --muted: #8a8aa8;
    --accent: #7c5cff;
    --accent2: #b394ff;
    --success: #2ecc71;
    --danger: #e74c3c;
    --warning: #f39c12;
    --info: #35b0de;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 1.4rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  nav button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  nav button:hover { color: var(--text); border-color: var(--accent); }
  nav button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  .tab { display: none; }
  .tab.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .card h2 {
    font-size: 1.1rem;
    margin-bottom: 14px;
    color: var(--accent2);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 800px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  input, select, textarea {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    width: 100%;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  textarea { resize: vertical; min-height: 90px; font-family: inherit; }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.88rem;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn.secondary {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn.danger {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
  }
  .btn.small { padding: 5px 10px; font-size: 0.78rem; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 0 1 auto; }
  .row .grow { flex: 1 1 180px; }

  .list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    background: var(--bg2);
    flex-wrap: wrap;
  }

  .list-item .name { flex: 1 1 140px; }
  .check { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .badge {
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.success { background: rgba(46,204,113,0.15); color: var(--success); }
  .badge.warning { background: rgba(243,156,18,0.15); color: var(--warning); }
  .badge.danger { background: rgba(231,76,60,0.15); color: var(--danger); }
  .badge.info { background: rgba(53,176,222,0.15); color: var(--info); }
  .badge.accent { background: rgba(124,92,255,0.15); color: var(--accent2); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  th, td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.72rem; }

  .muted { color: var(--muted); }
  .success-text { color: var(--success); }
  .danger-text { color: var(--danger); }

  .search-box { position: relative; }

  .result-item {
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .result-item:hover { background: var(--card); }

  .search-results {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg2);
    max-height: 240px;
    overflow-y: auto;
    margin-top: 6px;
    position: absolute;
    z-index: 50;
    left: 0;
    right: 0;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h2 { margin-bottom: 16px; color: var(--accent2); }

  .statut-select {
    width: auto;
    padding: 5px 8px;
    font-size: 0.78rem;
    border-radius: 6px;
  }

  @media (max-width: 700px) {
    main { padding: 12px; }
    header { padding: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎮 DofLib</h1>
  <nav>
    <button class="active" data-tab="farm">🧺 Farm List</button>
    <button data-tab="suivi">📋 Suivi items</button>
    <button data-tab="objectifs">🎯 Objectifs</button>
    <button data-tab="prix">🪙 Prix HDV</button>
    <button data-tab="brouillons">📝 Brouillons</button>
    <button data-tab="stuffs">🎒 Stuffs</button>
    <button data-tab="inventaire">📦 Inventaire</button>
  </nav>
</header>

<main>

  <!-- ============ FARM LIST ============ -->
  <section id="tab-farm" class="tab active">
    <div class="card">
      <h2>🧺 Items à craft</h2>
      <div id="farmItemsList"></div>
    </div>

    <div class="card">
      <h2>➕ Ajouter un item à craft</h2>
      <div class="row">
        <div class="search-box grow">
          <input type="text" id="farmSearchInput" placeholder="Rechercher un item DofusDB...">
          <div class="search-results" id="farmSearchResults"></div>
        </div>
        <input type="number" id="farmQty" value="1" min="1" style="width:80px;">
        <button class="btn" onclick="addFarmItemFromSearch()">Ajouter</button>
      </div>
    </div>

    <div class="card">
      <h2>⚙️ Générer la farm list</h2>
      <div class="row">
        <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;">
          <input type="checkbox" id="useInventory" checked> Soustraire l'inventaire
        </label>
        <button class="btn" id="generateBtn" onclick="generateFarm()">🔨 Générer la liste de farm</button>
      </div>
      <div id="generatedList" style="margin-top:16px;"></div>
    </div>
  </section>

  <!-- ============ SUIVI ITEMS ============ -->
  <section id="tab-suivi" class="tab">
    <div class="card">
      <h2>➕ Ajouter un item au suivi</h2>
      <div class="row" style="margin-bottom:12px;">
        <div class="search-box grow">
          <input type="text" id="suiviSearchInput" placeholder="Rechercher un item DofusDB..." autocomplete="off">
          <div class="search-results" id="suiviSearchResults"></div>
        </div>
        <input type="number" id="suiviQty" value="1" min="1" style="width:80px;" placeholder="Qté">
        <input type="text" id="suiviPerso" placeholder="Personnage" style="width:150px;" list="persoList">
        <datalist id="persoList"></datalist>
        <input type="text" id="suiviCompte" placeholder="Compte (opt.)" style="width:140px;">
        <select id="suiviStatut" style="width:130px;">
          <option value="a_farmer">🌾 À farmer</option>
          <option value="a_crafter">🔨 À crafter</option>
          <option value="en_cours">⚙️ En cours</option>
          <option value="fait">✅ Fait</option>
        </select>
        <button class="btn" onclick="addSuiviItem()">Ajouter</button>
      </div>
    </div>

    <div class="card">
      <h2>📋 Liste de suivi</h2>
      <div class="row" style="margin-bottom:14px;">
        <select id="suiviFiltre" style="width:180px;">
          <option value="tout">Tous les statuts</option>
          <option value="a_farmer">🌾 À farmer</option>
          <option value="a_crafter">🔨 À crafter</option>
          <option value="en_cours">⚙️ En cours</option>
          <option value="fait">✅ Fait</option>
        </select>
        <div class="muted" id="suiviCompteur" style="font-size:0.85rem;"></div>
      </div>
      <div id="suiviList"></div>
    </div>
  </section>

  <!-- ============ OBJECTIFS ============ -->
  <section id="tab-objectifs" class="tab">
    <div class="card">
      <h2>🎯 Objectifs</h2>
      <div class="row" style="margin-bottom:16px;">
        <input class="grow" type="text" id="objTitle" placeholder="Titre de l'objectif...">
        <input type="number" id="objQty" value="1" min="1" style="width:90px;" placeholder="Qté">
        <input type="date" id="objDeadline" style="width:160px;">
        <button class="btn" onclick="addObjectif()">Ajouter</button>
      </div>
      <div id="objectifsList"></div>
    </div>
  </section>

  <!-- ============ PRIX HDV ============ -->
  <section id="tab-prix" class="tab">
    <div class="card">
      <h2>🪙 Ajouter un prix HDV</h2>
      <div class="row">
        <input class="grow" type="text" id="prixName" placeholder="Nom de l'item...">
        <input type="number" id="prixValue" placeholder="Prix (kamas)" min="0" style="width:140px;">
        <input type="number" id="prixQty" value="1" min="1" style="width:80px;" placeholder="Qté">
        <button class="btn" onclick="addPrix()">Ajouter</button>
      </div>
    </div>
    <div class="card">
      <h2>📊 Historique des prix</h2>
      <div id="prixList"></div>
    </div>
  </section>

  <!-- ============ BROUILLONS ============ -->
  <section id="tab-brouillons" class="tab">
    <div class="grid-2">
      <div class="card">
        <h2>📝 Nouveau brouillon</h2>
        <input type="text" id="brTitre" placeholder="Titre (optionnel)" style="margin-bottom:10px;">
        <textarea id="brContenu" placeholder="Écris ton brouillon ici..."></textarea>
        <div class="row" style="margin-top:10px;">
          <button class="btn" id="brSaveBtn" onclick="addBrouillon()">Enregistrer</button>
        </div>
      </div>
      <div class="card">
        <h2>🗂️ Mes brouillons</h2>
        <div id="brouillonsList"></div>
      </div>
    </div>
  </section>

  <!-- ============ STUFFS ============ -->
  <section id="tab-stuffs" class="tab">
    <div class="card">
      <h2>🎒 Mes stuffs</h2>
      <div class="row" style="margin-bottom:16px;">
        <input class="grow" type="text" id="stuffName" placeholder="Nom du stuff...">
        <button class="btn" onclick="addStuff()">Créer le stuff</button>
      </div>
      <div id="stuffsList"></div>
    </div>
  </section>

  <!-- ============ INVENTAIRE ============ -->
  <section id="tab-inventaire" class="tab">
    <div class="card">
      <h2>📦 Inventaire</h2>
      <div class="row" style="margin-bottom:16px;">
        <input class="grow" type="text" id="invName" placeholder="Nom de l'item...">
        <input type="number" id="invQty" value="0" min="0" style="width:90px;" placeholder="Qté">
        <button class="btn" onclick="addInventaire()">Ajouter / Mettre à jour</button>
      </div>
      <div id="inventaireList"></div>
    </div>
  </section>

</main>

<!-- ============ MODALE STUFF ============ -->
<div class="modal-overlay" id="stuffModal">
  <div class="modal">
    <h2 id="stuffModalTitle">Modifier le stuff</h2>
    <input type="text" id="stuffModalName" placeholder="Nom du stuff" style="margin-bottom:12px;">
    <div class="search-box" style="margin-bottom:12px;">
      <input type="text" id="stuffSearchInput" placeholder="Ajouter un item au stuff..." autocomplete="off">
      <div class="search-results" id="stuffSearchResults"></div>
    </div>
    <div id="stuffModalItems"></div>
    <textarea id="stuffModalDesc" placeholder="Description (optionnel)" style="margin-top:12px;"></textarea>
    <div class="row" style="margin-top:14px;">
      <button class="btn" onclick="saveStuffModal()">💾 Enregistrer</button>
      <button class="btn secondary" onclick="closeStuffModal()">Fermer</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  UTILITAIRES
// ============================================================
async function api(url, options = {}) {
  const opts = { headers: { 'Content-Type': 'application/json' }, ...options };
  if (opts.body && typeof opts.body === 'object') opts.body = JSON.stringify(opts.body);
  const res = await fetch(url, opts);
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || `Erreur ${res.status}`);
  }
  return res.json();
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatNumber(n) {
  return Number(n || 0).toLocaleString('fr-FR');
}

// ============================================================
//  NAVIGATION ONGLETS
// ============================================================
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ============================================================
//  RECHERCHE DOFUSDB (partagée)
// ============================================================
function bindSearch(inputId, resultsId, onSelect) {
  const input = document.getElementById(inputId);
  const results = document.getElementById(resultsId);
  let timer = null;

  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) { results.innerHTML = ''; return; }
    timer = setTimeout(async () => {
      try {
        const items = await api('/api/search?q=' + encodeURIComponent(q));
        results.innerHTML = items.length
          ? items.map(i => `
              <div class="result-item" onclick="${onSelect}(${i.id}, ${JSON.stringify(i.name)});">
                <strong>${esc(i.name)}</strong> <span class="muted">(niv. ${i.level})</span>
              </div>
            `).join('')
          : '<div class="result-item muted">Aucun résultat</div>';
      } catch (e) {
        results.innerHTML = '<div class="result-item danger-text">Erreur: ' + esc(e.message) + '</div>';
      }
    }, 300);
  });

  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !results.contains(e.target)) results.innerHTML = '';
  });
}

// ============================================================
//  FARM LIST
// ============================================================
let currentFarmItems = [];
let selectedFarmItem = null;

async function loadFarmItems() {
  try {
    currentFarmItems = await api('/api/farm-items');
    renderFarmItems();
  } catch (e) {
    console.error(e);
  }
}

function renderFarmItems() {
  const list = document.getElementById('farmItemsList');
  if (!currentFarmItems.length) {
    list.innerHTML = '<p class="muted">Aucun item à craft. Ajoute-en un ci-dessous !</p>';
    return;
  }
  list.innerHTML = currentFarmItems.map(item => `
    <div class="list-item">
      <span class="name">${esc(item.item_name)}</span>
      <span class="badge info">×${esc(item.quantite)}</span>
      <button class="btn danger small" onclick="deleteFarmItem(${item.id})">✕</button>
    </div>
  `).join('');
}

function selectFarmItem(id, name) {
  selectedFarmItem = { id, name };
  document.getElementById('farmSearchInput').value = name;
  document.getElementById('farmSearchResults').innerHTML = '';
}

async function deleteFarmItem(id) {
  try {
    await api('/api/farm-items/' + id, { method: 'DELETE' });
    await loadFarmItems();
  } catch (e) {
    alert('Erreur: ' + e.message);
  }
}

async function addFarmItemFromSearch() {
  if (!selectedFarmItem) {
    alert('Recherche d\'abord un item dans la liste DofusDB.');
    return;
  }
  const qte = parseInt(document.getElementById('farmQty').value) || 1;
  try {
    await api('/api/farm-items', {
      method: 'POST',
      body: { item_id: selectedFarmItem.id, item_name: selectedFarmItem.name, quantite: qte }
    });
    selectedFarmItem = null;
    document.getElementById('farmSearchInput').value = '';
    document.getElementById('farmQty').value = 1;
    await loadFarmItems();
  } catch (e) {
    alert('Erreur: ' + e.message);
  }
}

async function generateFarm() {
  if (!currentFarmItems.length) {
    alert('Ajoute d\'abord des items à craft.');
    return;
  }
  const useInventory = document.getElementById('useInventory').checked;
  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Calcul en cours...';

  try {
    const data = await api('/api/generate-farm', {
      method: 'POST',
      body: { items: currentFarmItems, useInventory }
    });

    const container = document.getElementById('generatedList');
    let html = '<h3 style="margin-bottom:12px;">📋 Ressources nécessaires</h3>';

    if (data.errors && data.errors.length) {
      html += `<div class="card" style="border-color:var(--danger);">
        <h2>⚠️ Erreurs de récupération</h2>
        ${data.errors.map(e => `<p class="danger-text" style="margin-bottom:4px;">• ${esc(e)}</p>`).join('')}
      </div>`;
    }

    if (!data.resources.length) {
      html += '<p class="muted">Aucune ressource trouvée.</p>';
    } else {
      html += `<table>
        <thead><tr><th>Ressource</th><th>Total</th><th>Stock</th><th>À farmer</th></tr></thead>
        <tbody>
        ${data.resources.map(r => `
          <tr>
            <td>${esc(r.name)}</td>
            <td>${formatNumber(r.total)}</td>
            <td class="${r.stock > 0 ? 'success-text' : 'muted'}">${formatNumber(r.stock)}</td>
            <td><strong>${formatNumber(r.toFarm)}</strong></td>
          </tr>
        `).join('')}
        </tbody>
      </table>`;
    }

    container.innerHTML = html;
  } catch (e) {
    document.getElementById('generatedList').innerHTML =
      `<div class="card" style="border-color:var(--danger);"><h2>❌ Erreur</h2><p class="danger-text">${esc(e.message)}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔨 Générer la liste de farm';
  }
}

// ============================================================
//  SUIVI ITEMS
// ============================================================
let currentSuivi = [];
let selectedSuiviItem = null;

const STATUT_LABELS = {
  a_farmer:  { label: '🌾 À farmer',  badge: 'warning' },
  a_crafter: { label: '🔨 À crafter', badge: 'info' },
  en_cours:  { label: '⚙️ En cours',  badge: 'accent' },
  fait:      { label: '✅ Fait',       badge: 'success' }
};

async function loadSuivi() {
  try {
    currentSuivi = await api('/api/attributions');
    renderSuivi();
  } catch (e) {
    console.error(e);
  }
}

function getSuiviFiltered() {
  const filtre = document.getElementById('suiviFiltre').value;
  if (filtre === 'tout') return currentSuivi;
  return currentSuivi.filter(s => s.statut === filtre);
}

function renderSuivi() {
  // Remplit le datalist des personnages existants
  const persos = [...new Set(currentSuivi.map(s => s.personnage).filter(Boolean))];
  document.getElementById('persoList').innerHTML = persos.map(p => `<option value="${esc(p)}">`).join('');

  const filtered = getSuiviFiltered();
  const container = document.getElementById('suiviList');

  const compteur = document.getElementById('suiviCompteur');
  const faits = filtered.filter(s => s.statut === 'fait').length;
  compteur.textContent = `${filtered.length} item(s) — ${faits} fait(s)`;

  if (!filtered.length) {
    container.innerHTML = '<p class="muted">Aucun item dans le suivi pour ce filtre.</p>';
    return;
  }

  container.innerHTML = filtered.map(s => {
    const st = STATUT_LABELS[s.statut] || STATUT_LABELS.a_farmer;
    return `
      <div class="list-item">
        <span class="name">
          <strong>${esc(s.item_name)}</strong>
          <span class="muted">×${esc(s.quantite)}</span>
          <span class="muted" style="display:block;font-size:0.75rem;">
            👤 ${esc(s.personnage)}${s.compte ? ` · ${esc(s.compte)}` : ''}
          </span>
        </span>
        <span class="badge ${st.badge}">${st.label}</span>
        <select class="statut-select"
                onchange="updateSuiviStatut(${s.id}, this.value)">
          ${Object.entries(STATUT_LABELS).map(([val, info]) =>
            `<option value="${val}" ${s.statut === val ? 'selected' : ''}>${info.label}</option>`
          ).join('')}
        </select>
        <button class="btn danger small" onclick="deleteSuiviItem(${s.id})">✕</button>
      </div>
    `;
  }).join('');
}

function selectSuiviItem(id, name) {
  selectedSuiviItem = { id, name };
  document.getElementById('suiviSearchInput').value = name;
  document.getElementById('suiviSearchResults').innerHTML = '';
}

async function addSuiviItem() {
  if (!selectedSuiviItem) {
    alert('Recherche d\'abord un item dans la liste DofusDB.');
    return;
  }
  const quantite = parseInt(document.getElementById('suiviQty').value) || 1;
  const personnage = document.getElementById('suiviPerso').value.trim();
  const compte = document.getElementById('suiviCompte').value.trim();
  if (!personnage) {
    alert('Indique un personnage.');
    return;
  }
  const statut = document.getElementById('suiviStatut').value;
  try {
    await api('/api/attributions', {
      method: 'POST',
      body: { item_name: selectedSuiviItem.name, personnage, compte, quantite, statut }

    document.getElementById('suiviSearchInput').value = '';
    document.getElementById('suiviQty').value = 1;

    alert('Erreur: ' + e.message);
  }
}

async function updateSuiviStatut(id, statut) {
  try {
    const item = currentSuivi.find(s => s.id === id);

    await api('/api/attributions/' + id, {
      method: 'PUT',

    alert('Erreur: ' + e.message);

}

async function deleteSuiviItem(id) {
  try {
    await api('/api/attributions/' + id, { method: 'DELETE' });
    await loadSuivi();
  } catch (e) {
    alert('Erreur: ' + e.message);

// ============================================================
//  OBJECTIFS
// ============================================================
async function loadObjectifs() {
  try {
    const list = await api('/api/objectifs');
    renderObjectifs(list);
  } catch (e) {
    console.error(e);
  }
}

function renderObjectifs(list) {
  const container = document.getElementById('objectifsList');
  if (!list.length) {
    container.innerHTML = '<p class="muted">Aucun objectif pour le moment.</p>';
    return;
  }
  container.innerHTML = list.map(o => {
    const badge = o.statut === 'fait'
      ? '<span class="badge success">✓ Fait</span>'
      : o.statut === 'en_cours'
        ? '<span class="badge info">En cours</span>'
        : '<span class="badge warning">À faire</span>';
    return `
      <div class="list-item">
        <input type="checkbox" class="check" ${o.statut === 'fait' ? 'checked' : ''}
               onchange="toggleObjectif(${o.id}, this.checked)">
        <span class="name" style="${o.statut === 'fait' ? 'text-decoration:line-through;opacity:.5;' : ''}">
          <strong>${esc(o.titre)}</strong>
          ${o.quantite > 1 ? `<span class="muted">×${o.quantite}</span>` : ''}
          ${o.deadline ? `<span class="muted">— ${formatDate(o.deadline)}</span>` : ''}
        </span>
        ${badge}
        <button class="btn danger small" onclick="deleteObjectif(${o.id})">✕</button>
      </div>
    `;
  }).join('');
}

async function addObjectif() {
  const titre = document.getElementById('objTitle').value.trim();
  if (!titre) { alert('Un titre est requis.'); return; }
  const quantite = parseInt(document.getElementById('objQty').value) || 1;
  const deadline = document.getElementById('objDeadline').value || null;
  try {
    await api('/api/objectifs', { method: 'POST', body: { titre, quantite, deadline } });
    document.getElementById('objTitle').value = '';
    document.getElementById('objQty').value = 1;
    document.getElementById('objDeadline').value = '';
    await loadObjectifs();
  } catch (e) {
    alert('Erreur: ' + e.message);
  }
}

async function toggleObjectif(id, done) {
  try {
    const all = await api('/api/objectifs');
    const obj = all.find(o => o.id === id);
    if (!obj) return;
    await api('/api/objectifs/' + id, {
      method: 'PUT',
      body: {
        titre: obj.titre,
        description: obj.description,
        quantite: obj.quantite,
        deadline: obj.deadline,
        statut: done ? 'fait' : 'a_faire'
      }
    });
    await loadObjectifs();
  } catch (e) {
    console.error(e);
  }
}

async function deleteObjectif(id) {
  try {
    await api('/api/objectifs/' + id, { method: 'DELETE' });
    await loadObjectifs();
  } catch (e) {
    alert('Erreur: ' + e.message);
  }
}

// ============================================================
//  BROUILLONS
// ============================================================
let editingBrouillonId = null;

async function loadBrouillons() {
  try {
    const list = await api('/api/brouillons');
    renderBrouillons(list);
  } catch (e) {
    console.error(e);
  }
}

function renderBrouillons(list) {
  const container = document.getElementById('brouillonsList');
  if (!list.length) {
    container.innerHTML = '<p class="muted">Aucun brouillon.</p>';
    return;
  }
  container.innerHTML = list.map(b => `
    <div class="list-item" style="align-items:flex-start;">
      <div style="flex:1;">
        <strong>${esc(b.titre)}</strong>
        <p class="muted" style="margin-top:4px;white-space:pre-wrap;">${esc(b.contenu).slice(0, 200)}${b.contenu.length > 200 ? '...' : ''}</p>
        <p class="muted" style="font-size:0.75rem;margin-top:4px;">Modifié : ${formatDate(b.updatedAt)}</p>
      </div>
      <div class="row">
        <button class="btn secondary small" onclick="editBrouillon(${b.id})">✏️</button>
        <button class="btn danger small" onclick="deleteBrouillon(${b.id})">✕</button>
      </div>
    </div>
  `).join('');
}

async function addBrouillon() {
  const titre = document.getElementById('brTitre').value.trim() || 'Sans titre';
  const contenu = document.getElementById('brContenu').value;
  try {
    await api('/api/brouillons', { method: 'POST', body: { titre, contenu } });
    document.getElementById('brTitre').value = '';
    document.getElementById('brContenu').value = '';
    await loadBrouillons();
  } catch (e) {
    alert('Erreur: ' + e.message);
  }
}

async function deleteBrouillon(id) {
  try {
    await api('/api/brouillons/' + id, { method: 'DELETE' });
    await loadBrouillons();
  } catch (e) {
    alert('Erreur: ' + e.message);
  }
}

async function editBrouillon(id) {
  const list = await api('/api/brouillons');
  const b = list.find(x => x.id === id);
  if (!b) return;
  editingBrouillonId = id;
  document.getElementById('brTitre').value = b.titre;
  document.getElementById('brContenu').value = b.contenu;
  const btn = document.getElementById('brSaveBtn');
  btn.textContent = '💾 Mettre à jour';
  btn.onclick = async () => {
    const titre = document.getElementById('brTitre').value.trim() || 'Sans titre';
    const contenu = document.getElementById('brContenu').value;
    try {
      await api('/api/brouillons/' + editingBrouillonId, {
        method: 'PUT',
        body: { titre, contenu }
      });
      document.getElementById('brTitre').value = '';
      document.getElementById('brContenu').value = '';
      editingBrouillonId = null;
      btn.textContent = 'Enregistrer';
      btn.onclick = addBrouillon;
      await loadBrouillons();
    } catch (e) {
      alert('Erreur: ' + e.message);
    }
  };
}

// ============================================================
//  STUFFS
// ============================================================
let currentStuffs = [];
let editingStuffId = null;
let stuffItems = [];

async function loadStuffs() {
  try {
    currentStuffs = await api('/api/stuffs');
    renderStuffs();
  } catch (e) {
    console.error(e);
  }
}

function renderStuffs() {
  const container = document.getElementById('stuffsList');
  if (!currentStuffs.length) {
    container.innerHTML = '<p class="muted">Aucun stuff enregistré. Crée-en un !</p>';
    return;
  }
  container.innerHTML = currentStuffs.map(s => `
    <div class="list-item">
      <span class="name"><strong>${esc(s.nom)}</strong>
        <span class="muted">(${s.items.length} items)</span>
      </span>
      <button class="btn secondary small" onclick="openStuffModal(${s.id})">✏️ Modifier</button>
      <button class="btn danger small" onclick="deleteStuff(${s.id})">✕</button>
    </div>
  `).join('');
}

async function addStuff() {
  const nom = document.getElementById('stuffName').value.trim();
  if (!nom) { alert('Nom du stuff requis.'); return; }
  try {
    await api('/api/stuffs', { method: 'POST', body: { nom } });
    document.getElementById('stuffName').value = '';
    await loadStuffs();
  } catch (e) {
    alert('Erreur: ' + e.message);
  }
}

async function deleteStuff(id) {
  if (!confirm('Supprimer ce stuff ?')) return;
  try {
    await api('/api/stuffs/' + id, { method: 'DELETE' });
    await loadStuffs();
  } catch (e) {
    alert('Erreur: ' + e.message);
  }
}

async function openStuffModal(id) {
  editingStuffId = id;
  const stuff = currentStuffs.find(s => s.id === id);
  if (!stuff) return;
  document.getElementById('stuffModalTitle').textContent = 'Modifier : ' + stuff.nom;
  document.getElementById('stuffModalName').value = stuff.nom;
  document.getElementById('stuffModalDesc').value = stuff.description || '';
  stuffItems = [...stuff.items];
  renderStuffModalItems();
  document.getElementById('stuffSearchInput').value = '';
  document.getElementById('stuffSearchResults').innerHTML = '';
  document.getElementById('stuffModal').classList.add('show');
}

function closeStuffModal() {
  document.getElementById('stuffModal').classList.remove('show');
  editingStuffId = null;
  stuffItems = [];
}

function renderStuffModalItems() {
  const container = document.getElementById('stuffModalItems');
  if (!stuffItems.length) {
    container.innerHTML = '<p class="muted">Aucun item dans ce stuff.</p>';
    return;
  }
  container.innerHTML = stuffItems.map((item, idx) => `
    <div class="list-item">
      <span class="name">${esc(item.name)}</span>
      <button class="btn danger small" onclick="removeStuffItem(${idx})">✕</button>
    </div>
  `).join('');
}

function selectStuffItem(id, name) {
  if (stuffItems.some(i => i.id === id)) {
    alert('Cet item est déjà dans le stuff.');
    return;
  }
  stuffItems.push({ id, name });
  renderStuffModalItems();
  document.getElementById('stuffSearchInput').value = '';
  document.getElementById('stuffSearchResults').innerHTML = '';
}

function removeStuffItem(idx) {
  stuffItems.splice(idx, 1);
  renderStuffModalItems();
}

async function saveStuffModal() {
  const nom = document.getElementById('stuffModalName').value.trim();
  if (!nom) { alert('Nom requis.'); return; }
  const description = document.getElementById('stuffModalDesc').value;
  try {
    await api('/api/stuffs/' + editingStuffId, {
      method: 'PUT',
      body: { nom, items: stuffItems, description }
    });
    closeStuffModal();
    await loadStuffs();
  } catch (e) {
    alert('Erreur: ' + e.message);
  }
}
